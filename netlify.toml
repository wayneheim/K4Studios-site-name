##############################
# ✅ Edge / Functions / Build
##############################
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["archiver"]

[[edge_functions]]
  function = "smart-404-edge"
  path = "/Galleries/*"

[[edge_functions]]
  function = "smart-404-edge"
  path = "/galleries/*"

[[edge_functions]]
  function = "smart-404-edge"
  path = "/Other/*"

[[edge_functions]]
  function = "smart-404-edge"
  path = "/Photography-Galleries/*"

# TEMPORARILY DISABLED - testing SSR breakage
# [[edge_functions]]
# function = "block-countries"
# path = "/*"

[build]
  command = "npm run build && node scripts/purge-cloudflare.js"

# Local/utility build context for prebuilt deploy workflows.
# Does NOT affect production builds unless you explicitly run with this context.
[context.branch-deploy]
  command = "npm run build:fast"
