##############################
# ✅ Smart Cache Policy — SEO-Safe & i-Page Compatible
##############################

# Static assets (CSS, JS, images, etc.)
[[headers]]
for = "/assets/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

# Astro build artifacts
[[headers]]
for = "/_astro/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

# Fonts (long-term cache)
[[headers]]
for = "/fonts/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

# Individual image pages (/i-xxx/) — must stay dynamic
[[headers]]
for = "/*/i-*/*"
  [headers.values]
  Cache-Control = "no-cache, no-store, must-revalidate"

# Regular HTML pages (landing, blog, glossary, etc.)
[[headers]]
for = "/*.html"
  [headers.values]
  Cache-Control = "public, max-age=3600, must-revalidate"

# Global fallback
[[headers]]
for = "/*"
  [headers.values]
  Cache-Control = "public, max-age=3600, must-revalidate"


##############################
# ✅ Legacy & Backup Path Fixes (Add-on)
##############################

# --- Legacy "Backup" or "Copy" folders from SmugMug exports ---
[[redirects]]
from = "/Galleries/Painterly-Fine-Art-Photography/Facing-History/*/{Color,Black-White}{%20Backup, Backup, copy, Copy, -back2}/*"
to = "/Galleries/Painterly-Fine-Art-Photography/Facing-History/:splat/index.html"
status = 301
force = true

# --- Old zPainterly galleries ---
[[redirects]]
from = "/Galleries/zPainterly-Western-Cowboy-Portraits/*"
to = "/Galleries/Painterly-Fine-Art-Photography/Facing-History/Western-Cowboy-Portraits/:splat"
status = 301
force = true

# --- Old Photography-Galleries structure ---
[[redirects]]
from = "/Photography-Galleries/*"
to = "/Galleries/:splat"
status = 301
force = true

# --- Photoshoots and Events (legacy SmugMug archives, not canon) ---
[[redirects]]
from = "/Photoshootsandevents/*"
to = "/"
status = 410
force = true

# --- Legacy Fine-Art-Photography duplicates ---
# NOTE: Removed broad redirect that forced ALL Fine-Art-Photography paths
#       to Painterly-Fine-Art-Photography, which broke Traditional routes.
#       If specific legacy subpaths need mapping, add them explicitly below
#       instead of a blanket catch-all.

# Pictorialist legacy path → new standalone page
[[redirects]]
from = "/Galleries/Painterly-Fine-Art-Photography/Pictorialist"
to = "/Pictorialist-Photography"
status = 301
force = true

# Old Landscapes-Gallery structure → redirect to Painterly landscapes (then SSR handles 410 if image missing)
[[redirects]]
from = "/Galleries/Landscapes-Gallery/*"
to = "/Galleries/Painterly-Fine-Art-Photography/Landscapes/By-Location/International/Gallery/:splat"
status = 301
force = true

# K4 Select Series → SmugMug
[[redirects]]
from = "/Galleries/K4-Select-Series/*"
to = "https://wayne-heim.smugmug.com/Other/K4-Select-Series/:splat"
status = 301
force = true

# --- Legacy SmugMug RSS feed format URLs ---
[[redirects]]
from = "/*"
query = {format = "rss200"}
to = "/"
status = 410
force = true

[[redirects]]
from = "/*"
query = {Type = "gallery"}
to = "/"
status = 410
force = true

# Legacy SmugMug query params - goTo API spam
[[redirects]]
from = "/*"
query = {goTo = ":goTo"}
to = "/"
status = 410
force = true

# Legacy SmugMug query params - theme/view
[[redirects]]
from = "/*"
query = {theme = ":theme"}
to = "/"
status = 410
force = true

# --- Old numeric SmugMug gallery paths ---
[[redirects]]
from = "/gallery/*"
to = "/"
status = 410
force = true

# --- Global Backup/Copy safety catch-all ---
[[redirects]]
from = "/Galleries/*{Backup,copy,Copy,back2}/*"
to = "/"
status = 410
force = true


##############################
# ✅ Crawl-Debt Cleanup
##############################

# Legacy SmugMug keyword URLs (e.g., /keyword/cowboy, /keyword/xyz)
[[redirects]]
from = "/keyword/*"
to = "/"
