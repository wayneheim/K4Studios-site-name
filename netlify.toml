##############################
# ✅ Smart Cache Policy — SEO-Safe & i-Page Compatible
##############################

# Static assets (CSS, JS, images, etc.)
[[headers]]
for = "/assets/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

# Astro build artifacts
[[headers]]
for = "/_astro/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

# Fonts (long-term cache)
[[headers]]
for = "/fonts/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

# Individual image pages (/i-xxx/) — must stay dynamic
[[headers]]
for = "/*/i-*/*"
  [headers.values]
  Cache-Control = "no-cache, no-store, must-revalidate"

# Data endpoints (JSON) — must never be edge-cached (prevents cached 404s)
[[headers]]
for = "/data/*"
  [headers.values]
  Cache-Control = "no-store, max-age=0"
  CDN-Cache-Control = "no-store"
  Netlify-CDN-Cache-Control = "no-store"

# Regular HTML pages (landing, blog, glossary, etc.)
[[headers]]
for = "/*.html"
  [headers.values]
  Cache-Control = "public, max-age=3600, must-revalidate"

# Global fallback
[[headers]]
for = "/*"
  [headers.values]
  Cache-Control = "public, max-age=3600, must-revalidate"


