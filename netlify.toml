# ──────────────────────────────────────────────
# 🚀 K4 Studios | Netlify Build Configuration
# With Cloudflare Auto-Purge Integration
# ──────────────────────────────────────────────

[build]
  command = "npm run build && bash ./scripts/purge-cloudflare-cache.sh"
  publish = "dist" # adjust if Astro output differs

[build.environment]
  NODE_VERSION = "18"
  ASTRO_TELEMETRY_DISABLED = "1"
  NPM_FLAGS = "--prefer-offline"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ───────────────
# HEADERS
# ───────────────
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ───────────────
# EDGE FUNCTIONS
# ───────────────
[[edge_functions]]
  function = "block-countries"
  path = "/*"

