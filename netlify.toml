# ======================================================
# Netlify configuration for https://www.k4studios.com
# Author: Wayne Heim (K4 Studios)
# Purpose: Support static galleries, clean legacy crawl debt,
#          and block legacy SmugMug endpoints.
# ======================================================

##############################
# ✅ Local Development Settings
##############################
[dev]
  framework = "astro"
  command = "npx astro dev --host --port 4321 --strictPort"
  port = 8888
  targetPort = 4321
  autoLaunch = false

##############################
# ✅ Analytics Worker Proxy
# Local Netlify preview does not own these routes, but production does via
# the Cloudflare analytics worker. Proxy them in dev so preview pages stop
# POSTing into the local 404 handler.
##############################
[[redirects]]
from = "/__k4e"
to = "https://k4-analytics.wayneheim.workers.dev/__k4e"
status = 200
force = true

[[redirects]]
from = "/_state"
to = "https://k4-analytics.wayneheim.workers.dev/_state"
status = 200
force = true

[[redirects]]
from = "/edge-event"
to = "https://k4-analytics.wayneheim.workers.dev/edge-event"
status = 200
force = true

[[redirects]]
from = "/__k4track/event"
to = "https://k4-analytics.wayneheim.workers.dev/__k4track/event"
status = 200
force = true

[[redirects]]
from = "/__k4serp"
to = "https://k4-image-proxy.wayneheim.workers.dev/__k4serp"
status = 200
force = true

[[redirects]]
from = "/__k4serp/*"
to = "https://k4-image-proxy.wayneheim.workers.dev/__k4serp/:splat"
status = 200
force = true

##############################
# ✅ Trailing Slash Normalization
# Prevents Smart-404 function burns caused by slash variants.
# Example: /Galleries/.../i-XXXXX/ -> /Galleries/.../i-XXXXX
# Root (/) is untouched.
##############################
[[redirects]]
from = "https://k4studios.com/(.+)/$"
to = "https://www.k4studios.com/$1"
status = 301
force = true
regex = true

[[redirects]]
from = "^/(.+)/$"
to = "/$1"
status = 301
force = true
regex = true

##############################
# ✅ URL Case Normalization (prevents duplicate content)
# Redirect lowercase /galleries/ to proper-case /Galleries/
# These are free CDN-level redirects, not function invocations
##############################

# WWII Portraits Color (all 20 indexed lowercase variants)
[[redirects]]
from = "/galleries/painterly-fine-art-photography/facing-history/wwii/portraits/color/:id"
to = "/Galleries/Painterly-Fine-Art-Photography/Facing-History/WWII/Portraits/Color/:id"
status = 301
force = true

# Catch-all for any other lowercase /galleries/ paths
[[redirects]]
from = "/galleries/*"
to = "/Galleries/:splat"
status = 301
force = true

##############################
# ✅ Image Proxy - Route /img/* to Cloudflare Worker
# This hides SmugMug URLs from crawlers
# In dev: Astro middleware handles this (302 redirect to worker)
# In prod: Netlify edge redirect handles this (200 proxy)
##############################
[[redirects]]
from = "/img/OG-:id/:size.jpg"
to = "/img/:id/:size.jpg"
status = 301
force = true

[[redirects]]
from = "/img/TW-:id/:size.jpg"
to = "/img/:id/:size.jpg"
status = 301
force = true

[[redirects]]
from = "/img/PN-:id/:size.jpg"
to = "/img/:id/:size.jpg"
status = 301
force = true

[[redirects]]
from = "/img/SD-:id/:size.jpg"
to = "/img/:id/:size.jpg"
status = 301
force = true

[[redirects]]
from = "/img/OG-:id/:size"
to = "/img/:id/:size.jpg"
status = 301
force = true

[[redirects]]
from = "/img/TW-:id/:size"
to = "/img/:id/:size.jpg"
status = 301
force = true

[[redirects]]
from = "/img/PN-:id/:size"
to = "/img/:id/:size.jpg"
status = 301
force = true

[[redirects]]
from = "/img/SD-:id/:size"
to = "/img/:id/:size.jpg"
status = 301
force = true

[[redirects]]
from = "/img/*"
to = "https://k4-image-proxy.wayneheim.workers.dev/img/:splat"
status = 200
force = true

