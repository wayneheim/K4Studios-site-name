# ======================================================
# Netlify configuration for https://www.k4studios.com
# Author: Wayne Heim (K4 Studios)
# Purpose: Support static galleries, clean legacy crawl debt,
#          and block legacy SmugMug endpoints.
# ======================================================

##############################
# ✅ URL Case Normalization (prevents duplicate content)
# Redirect lowercase /galleries/ to proper-case /Galleries/
# These are free CDN-level redirects, not function invocations
##############################

# WWII Portraits Color (all 20 indexed lowercase variants)
[[redirects]]
from = "/galleries/painterly-fine-art-photography/facing-history/wwii/portraits/color/:id"
to = "/Galleries/Painterly-Fine-Art-Photography/Facing-History/WWII/Portraits/Color/:id"
status = 301
force = true

# Catch-all for any other lowercase /galleries/ paths
[[redirects]]
from = "/galleries/*"
to = "/Galleries/:splat"
status = 301
force = true

##############################
# ✅ Image Proxy - Route /img/* to Cloudflare Worker
# This hides SmugMug URLs from crawlers
##############################
[[redirects]]
from = "/img/*"
to = "https://k4-image-proxy.wayneheim.workers.dev/img/:splat"
status = 200
force = true

##############################
# ✅ Core Files
##############################
[[redirects]]
from = "/robots.txt"
to = "/robots.txt"
status = 200

[[redirects]]
from = "/sitemap.xml"
to = "/sitemap.xml"
status = 200

# Redirect legacy Astro sitemap files to main sitemap
[[redirects]]
from = "/sitemap-index.xml"
to = "/sitemap.xml"
status = 301
force = true

[[redirects]]
from = "/sitemap-0.xml"
to = "/sitemap.xml"
status = 301
force = true

# Redirect bare lightbox page to 410 Gone (legacy SmugMug endpoint)
# NOTE: /Galleries/lightbox?dataset=... is allowed for internal "View Complete Gallery" use
# Only the bare URL without query params is blocked
[[redirects]]
from = "/Galleries/lightbox"
to = "/"
status = 410
force = false

