name = "k4-image-proxy"
main = "k4-image-proxy.js"
compatibility_date = "2024-01-01"

# Route configuration
# Deploy to: k4studios.com/img/*
# 
# In Cloudflare Dashboard:
# 1. Workers & Pages → k4-image-proxy → Settings → Triggers
# 2. Add Route: k4studios.com/img/*
# 3. Zone: k4studios.com

# Service binding — analytics worker delegation (Phase 5)
[[services]]
binding = "ANALYTICS"
service = "k4-analytics"

[vars]
ANALYTICS_ENABLED = "true"
# MANIFEST_CACHE_TTL = "3600"

# D1 Database for analytics
[[d1_databases]]
binding = "DB"
database_name = "k4-analytics"
database_id = "f2c159b0-b0f1-4056-934c-90e9b8a92e14"

# Development settings
[dev]
port = 8787

# Scheduled triggers for SERP tracking - DISABLED (using GSC API instead)
# Uncomment to re-enable DataForSEO daily checks
# [triggers]
# crons = ["0 6 * * *"]

# Production settings
[env.production]
# Routes are configured in Cloudflare Dashboard, not here
# This prevents accidental route changes during deploys

[env.production.vars]
ANALYTICS_ENABLED = "true"

[[env.production.services]]
binding = "ANALYTICS"
service = "k4-analytics"

[[env.production.d1_databases]]
binding = "DB"
database_name = "k4-analytics"
database_id = "f2c159b0-b0f1-4056-934c-90e9b8a92e14"
