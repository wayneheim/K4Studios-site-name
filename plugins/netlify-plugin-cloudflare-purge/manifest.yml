name: netlify-plugin-cloudflare-purge
inputs:
  - name: zone_id
    description: "Cloudflare Zone ID. If omitted the plugin will read CF_ZONE_ID from the environment."
    required: false
  - name: purge_everything
    description: "Whether to purge the whole zone. If false, plugin will look for CF_PURGE_FILES env var with comma-separated URLs. Defaults to true."
    required: false
    default: true
  - name: fail_on_error
    description: "If true the plugin will fail the build when the purge request fails. Defaults to false."
    required: false
    default: false
