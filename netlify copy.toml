##############################
# ✅ Edge / Functions / Build
##############################
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[edge_functions]]
function = "block-countries"
path = "/*"

[build]
  command = "npm run build && node scripts/purge-cloudflare.js"
