##############################
# ✅ Header Policy (SEO-Friendly Hybrid Cache)
##############################

# HTML pages → revalidated every hour (keeps Googlebot happy)
[[headers]]
for = "/*.html"
  [headers.values]
  Cache-Control = "public, max-age=3600, must-revalidate"

# Astro or asset bundles → long-term cache (safe even if folder not used)
[[headers]]
for = "/_astro/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

# Generic /assets/ fallback (covers any renamed or legacy build outputs)
[[headers]]
for = "/assets/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

# Fonts (future-proof)
[[headers]]
for = "/fonts/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

# Global fallback → ensures any other files aren’t stale-cached
[[headers]]
for = "/*"
  [headers.values]
  Cache-Control = "public, max-age=3600, must-revalidate"


##############################
# ✅ Legacy & Backup Path Fixes (Add-on)
##############################

# --- Legacy "Backup" or "Copy" folders from SmugMug exports ---
[[redirects]]
from = "/Galleries/Painterly-Fine-Art-Photography/Facing-History/*/{Color,Black-White}{%20Backup, Backup, copy, Copy, -back2}/*"
to = "/Galleries/Painterly-Fine-Art-Photography/Facing-History/:splat/index.html"
status = 301
force = true

# --- Old zPainterly galleries ---
[[redirects]]
from = "/Galleries/zPainterly-Western-Cowboy-Portraits/*"
to = "/Galleries/Painterly-Fine-Art-Photography/Facing-History/Western-Cowboy-Portraits/:splat"
status = 301
force = true

# --- Old Photography-Galleries structure ---
[[redirects]]
from = "/Photography-Galleries/*"
to = "/Galleries/:splat"
status = 301
force = true

# --- Photoshoots and Events (no dash / lowercase legacy path) ---
[[redirects]]
from = "/Photoshootsandevents/*"
to = "https://wayne-heim.smugmug.com/Other/Photo-Shoots/:splat"
status = 301
force = true

# --- Legacy Fine-Art-Photography duplicates ---
[[redirects]]
from = "/Galleries/Fine-Art-Photography/*"
to = "/Galleries/Painterly-Fine-Art-Photography/:splat"
status = 301
force = true

# --- Old numeric SmugMug gallery paths ---
[[redirects]]
from = "/gallery/*"
to = "/"
status = 410
force = true

# --- Global Backup/Copy safety catch-all ---
[[redirects]]
from = "/*{Backup,copy,Copy,back2}/*"
to = "/"
status = 410
force = true

##############################
# ✅ Crawl-Debt Cleanup
##############################
# Remove duplicate SmugMug and backend junk
[[redirects]]
from = "/{api,api/v1,api/v2,api/v3,key,photo,buy,cart,upload,video}/*"
to = "/"
status = 410
force = true

# --- Legacy SmugMug feeds (primary duplicate source) ---
[[redirects]]
from = "/hack/feed.mg"
to = "/"
status = 410
force = true
query = "*"

# --- Legacy Photo Shoots Root Redirect ---
[[redirects]]
from = "/Other/Photo-Shoots"
to = "https://wayne-heim.smugmug.com/Other/Photo-Shoots"
status = 301
force = true

# --- Legacy Photo Shoots and Themes ---
[[redirects]]
from = "/Other/Photo-Shoots-and-Themes/*"
